<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contraseña – ManuMarket</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">Restablecer contraseña</h2>
      <p class="text-sm text-gray-600 mb-4">
        Ingresa el código que recibiste por correo y define una nueva contraseña.
      </p>
      <form id="resetForm" class="space-y-4">
        <div>
          <label for="inputToken" class="block text-sm font-medium text-gray-700">Código de recuperación</label>
          <input
            id="inputToken"
            name="token"
            type="text"
            required
            class="mt-1 w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="inputPassword" class="block text-sm font-medium text-gray-700">Nueva contraseña</label>
          <input
            id="inputPassword"
            name="password"
            type="password"
            minlength="8"
            required
            class="mt-1 w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="inputConfirm" class="block text-sm font-medium text-gray-700">Confirmar contraseña</label>
          <input
            id="inputConfirm"
            name="confirmPassword"
            type="password"
            minlength="8"
            required
            class="mt-1 w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Actualizar contraseña
        </button>
      </form>
      <div id="result" class="mt-4 text-sm text-center"></div>
      <p class="mt-6 text-center text-sm">
        <a href="/" class="text-blue-600 hover:underline">Regresar al inicio de sesión</a>
      </p>
    </div>

    <script>
      const tokenInput = document.getElementById("inputToken");
      const params = new URLSearchParams(window.location.search);
      const presetToken = params.get("token");
      if (presetToken) {
        tokenInput.value = presetToken;
        tokenInput.defaultValue = presetToken;
        tokenInput.readOnly = true;
      }

      const form = document.getElementById("resetForm");
      const resultBox = document.getElementById("result");

      function showMessage(message, type = "info") {
        const colors = {
          info: "text-gray-700",
          success: "text-green-600",
          error: "text-red-600",
        };
        resultBox.className = `mt-4 text-sm text-center ${colors[type] || colors.info}`;
        resultBox.innerHTML = message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const token = tokenInput.value.trim();
        const password = form.password.value;
        const confirmPassword = form.confirmPassword.value;

        if (!token) {
          showMessage("El código de recuperación es obligatorio.", "error");
          return;
        }
        if (!password || password.length < 8) {
          showMessage("La contraseña debe tener al menos 8 caracteres.", "error");
          return;
        }
        if (password !== confirmPassword) {
          showMessage("Las contraseñas no coinciden.", "error");
          return;
        }

        try {
          const response = await fetch("/api/auth/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password, confirmPassword }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "No se pudo restablecer la contraseña.");
          }

          showMessage(data.detail || "Contraseña actualizada con éxito.", "success");
          form.reset();
          if (!presetToken) {
            tokenInput.value = "";
          } else {
            tokenInput.value = presetToken;
          }
        } catch (error) {
          showMessage(error.message || "No se pudo restablecer la contraseña.", "error");
        }
      });
    </script>
  </body>
</html>
