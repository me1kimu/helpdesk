<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña – ManuMarket</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">Recuperar contraseña</h2>
      <p class="text-sm text-gray-600 mb-4">
        Ingresa tu correo electrónico y te enviaremos un enlace para restaurar tu contraseña.
      </p>
      <form id="recoverForm" class="space-y-4">
        <div>
          <label for="inputEmail" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input
            id="inputEmail"
            name="email"
            type="email"
            required
            class="mt-1 w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Enviar enlace
        </button>
      </form>
      <div id="result" class="mt-4 text-sm text-center"></div>
      <p class="mt-6 text-center text-sm">
        <a href="/" class="text-blue-600 hover:underline">Regresar al inicio de sesión</a>
      </p>
    </div>

    <script>
      const form = document.getElementById("recoverForm");
      const resultBox = document.getElementById("result");

      function showMessage(message, type = "info") {
        const colors = {
          info: "text-gray-700",
          success: "text-green-600",
          error: "text-red-600",
        };
        resultBox.className = `mt-4 text-sm text-center ${colors[type] || colors.info}`;
        resultBox.innerHTML = message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = form.email.value.trim();
        if (!email) {
          showMessage("Ingresa un correo válido.", "error");
          return;
        }

        try {
          const response = await fetch("/api/auth/recover", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "No se pudo procesar la solicitud.");
          }

          let message = data.detail || "Si el correo existe, enviaremos un enlace.";
          if (data.token) {
            const resetUrl = data.reset_url || `/reset-password?token=${data.token}`;
            message += ` <br /><span class="block mt-2">Código temporal:</span><code class="bg-gray-100 px-2 py-1 rounded text-xs">${data.token}</code>`;
            message += ` <br /><a class="mt-2 inline-block text-blue-600 hover:underline" href="${resetUrl}">Continuar con el cambio de contraseña</a>`;
          }

          showMessage(message, "success");
          form.reset();
        } catch (error) {
          showMessage(error.message || "No se pudo procesar la solicitud.", "error");
        }
      });
    </script>
  </body>
</html>
